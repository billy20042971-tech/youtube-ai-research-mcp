name: AI Self-Healing Code Repair

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify OpenAI repair credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "AI self-healing blocked: OPENAI_API_KEY not configured" --body "OPENAI_API_KEY is not available to this workflow run."
            exit 1
          fi
          echo "OPENAI_API_KEY is available to the runner."

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex@0.130.0
          codex --version

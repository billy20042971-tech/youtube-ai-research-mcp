name: AI Self-Healing Code Repair

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify OpenAI repair credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "AI self-healing blocked: OPENAI_API_KEY not configured" --body "OPENAI_API_KEY is not available to this workflow run."
            exit 1
          fi
          echo "OPENAI_API_KEY is available to the runner."

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex@0.130.0
          codex --version

      - name: Run Codex read-only analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          codex exec \
            --model gpt-5.6 \
            --sandbox read-only \
            "You are performing a READ-ONLY diagnostic of this repository. Inspect AGENTS.md if present, the GitHub workflow files, and the main application/scripts. Do not modify, create, delete, commit, or push any files. Do not use network access except the Codex model service required for this run, and do not expose or read repository secrets. Report: (1) repository purpose, (2) current YouTube research pipeline architecture, (3) likely failure points relevant to self-healing, (4) concrete safe improvements for the next repair layer. Your task is analysis only."

name: YouTube Research Self-Healing

on:
  schedule:
    - cron: "40-59/10 0 * * *"
    - cron: "0-40/10 1 * * *"
  workflow_run:
    workflows: ["Daily YouTube Research via MCP"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: youtube-ai-research-self-healing
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production state and recover if needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          export TODAY_TAIPEI="$(TZ=Asia/Taipei date +%Y-%m-%d)"

          STATE_URL="https://api.github.com/repos/$REPO/contents/data/execution-state.json?ref=main"
          if curl --fail-with-body -sS             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "$STATE_URL" -o state.json; then
            if python - <<'PY'
          import base64, json, os, sys
          raw=json.load(open("state.json",encoding="utf-8"))
          state=json.loads(base64.b64decode(raw["content"]).decode("utf-8"))
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=os.environ["TODAY_TAIPEI"]
          def taipei_date(value):
              if not value: return None
              try:
                  dt=datetime.fromisoformat(value.replace("Z","+00:00"))
                  if dt.tzinfo is None: dt=dt.replace(tzinfo=ZoneInfo("UTC"))
                  return dt.astimezone(ZoneInfo("Asia/Taipei")).date().isoformat()
              except Exception:
                  return None
          trigger=state.get("trigger")
          eligible_trigger=(trigger=="schedule" or (trigger=="workflow_dispatch" and state.get("recovery_attempt") is True))
          success=(
              eligible_trigger
              and state.get("status")=="SUCCESS"
              and taipei_date(state.get("completed_at"))==today
              and taipei_date(state.get("data_generated_at"))==today
              and state.get("data")=="PASS"
              and state.get("reports")=="PASS"
              and state.get("verification")=="PASS"
              and state.get("data_verification",{}).get("verified_72h") is True
              and state.get("data_verification",{}).get("fresh_videos",0)>0
              and state.get("data_verification",{}).get("stale_or_invalid_videos",0)==0
          )
          if success:
              print("SELF_HEALING: today's verified production data already exists.")
              sys.exit(0)
          print("SELF_HEALING: today's verified production data is not complete.")
          PY
            then
              exit 0
            fi
          else
            echo "SELF_HEALING: execution-state.json unavailable; recovery is required."
          fi

          API="https://api.github.com/repos/$REPO/actions/workflows/daily-youtube-research.yml/runs?per_page=50"
          curl --fail-with-body -sS             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "$API" -o runs.json

          NEED_RECOVERY="$(python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=os.environ["TODAY_TAIPEI"]
          runs=json.load(open("runs.json",encoding="utf-8")).get("workflow_runs",[])
          def taipei_date(value):
              try:
                  return datetime.fromisoformat(value.replace("Z","+00:00")).astimezone(ZoneInfo("Asia/Taipei")).date().isoformat()
              except Exception:
                  return None
          todays=[r for r in runs if taipei_date(r.get("created_at",""))==today]
          active=any(r.get("status") in {"queued","in_progress"} for r in todays)
          dispatches=sum(1 for r in todays if r.get("event")=="workflow_dispatch")
          if active:
              print("no")
          elif dispatches >= 5:
              print("no")
          else:
              print("yes")
          PY
          )"

          if [ "$NEED_RECOVERY" != "yes" ]; then
            echo "SELF_HEALING: no dispatch needed right now."
            exit 0
          fi

          echo "SELF_HEALING: dispatching a fresh verified production recovery run."
          curl --fail-with-body -sS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/$REPO/actions/workflows/daily-youtube-research.yml/dispatches"             -d '{"ref":"main","inputs":{"recovery_attempt":"true"}}'

          echo "SELF_HEALING: recovery dispatched successfully."

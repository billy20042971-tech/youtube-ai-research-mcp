name: YouTube Research Self-Healing

on:
  schedule:
    - cron: "40-59/10 22 * * *"  # 06:40-06:50 Asia/Taipei
    - cron: "0-40/10 23 * * *"  # 07:00-07:40 Asia/Taipei
  workflow_run:
    workflows: ["Daily YouTube Research via MCP"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: youtube-ai-research-self-healing
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository scripts
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check production state and recover if needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          export TODAY_TAIPEI="$(TZ=Asia/Taipei date +%Y-%m-%d)"

          STATE_URL="https://api.github.com/repos/$REPO/contents/data/execution-state.json?ref=main"
          if curl --fail-with-body -sS             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "$STATE_URL" -o state.json; then
            if python - <<'PY'
          import base64, json, os, sys
          raw=json.load(open("state.json",encoding="utf-8"))
          state=json.loads(base64.b64decode(raw["content"]).decode("utf-8"))
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=os.environ["TODAY_TAIPEI"]
          def taipei_dt(value):
              if not value: return None
              try:
                  dt=datetime.fromisoformat(value.replace("Z","+00:00"))
                  if dt.tzinfo is None: dt=dt.replace(tzinfo=ZoneInfo("UTC"))
                  return dt.astimezone(ZoneInfo("Asia/Taipei"))
              except Exception:
                  return None
          def taipei_date(value):
              dt=taipei_dt(value)
              return dt.date().isoformat() if dt else None
          trigger=state.get("trigger")
          recovery=(trigger=="workflow_dispatch" and state.get("recovery_attempt") is True)
          scheduled=taipei_dt(state.get("started_at"))
          # A successful but late schedule run must not mask a missed 06:00
          # deadline. Recovery runs are explicitly marked and may complete later.
          schedule_on_time=(trigger=="schedule" and scheduled is not None and
                            scheduled.date().isoformat()==today and
                            (scheduled.hour, scheduled.minute) <= (6, 15))
          eligible_trigger=(schedule_on_time or recovery)
          success=(
              eligible_trigger
              and state.get("status")=="SUCCESS"
              and taipei_date(state.get("completed_at"))==today
              and taipei_date(state.get("data_generated_at"))==today
              and state.get("data")=="PASS"
              and state.get("reports")=="PASS"
              and state.get("verification")=="PASS"
              and state.get("data_verification",{}).get("verified_72h") is True
              and state.get("data_verification",{}).get("fresh_videos",0)>0
              and state.get("data_verification",{}).get("stale_or_invalid_videos",0)==0
          )
          if success:
              print("SELF_HEALING: today's verified production data already exists.")
              sys.exit(0)
          print("SELF_HEALING: today's verified production data is not complete.")
          # A non-zero exit is required so the shell continues into recovery.
          # Previously this branch returned 0 implicitly and was treated as success.
          sys.exit(1)
          PY
            then
              exit 0
            else
              # An incomplete state is an expected recovery condition, not a shell error.
              echo "SELF_HEALING: verified production state is incomplete; continuing to recovery policy."
            fi
          else
            echo "SELF_HEALING: execution-state.json unavailable; recovery is required."
          fi

          API="https://api.github.com/repos/$REPO/actions/workflows/daily-youtube-research.yml/runs?per_page=50"
          curl --fail-with-body -sS             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "$API" -o runs.json

          POLICY_OUTPUT="$(python scripts/recovery_policy.py --runs runs.json --today "$TODAY_TAIPEI" --max-recoveries 5)"
          # Preserve the structured decision in logs so a skipped recovery has an auditable reason.
          echo "SELF_HEALING_POLICY: $(printf '%s\n' "$POLICY_OUTPUT" | head -n 1)"
          NEED_RECOVERY="$(printf '%s\n' "$POLICY_OUTPUT" | tail -n 1)"

          if [ "$NEED_RECOVERY" != "yes" ]; then
            echo "SELF_HEALING: no dispatch needed right now; decision=$NEED_RECOVERY"
            exit 0
          fi

          echo "SELF_HEALING: dispatching a fresh verified production recovery run."
          # Capture HTTP errors without curl --fail-with-body so errexit cannot hide the status code.
          set +e
          DISPATCH_HTTP_STATUS="$(curl -sS -o dispatch-response.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$REPO/actions/workflows/daily-youtube-research.yml/dispatches" \
            -d '{"ref":"main","inputs":{"recovery_attempt":"true"}}')"
          CURL_EXIT_CODE=$?
          set -e
          echo "SELF_HEALING: recovery dispatch curl_exit_code=$CURL_EXIT_CODE http_status=${DISPATCH_HTTP_STATUS:-empty}."
          if [ "$CURL_EXIT_CODE" -ne 0 ]; then
            echo "::error::Recovery dispatch HTTP request failed at the transport/client layer."
            if [ -s dispatch-response.txt ]; then cat dispatch-response.txt; fi
            exit 1
          fi
          if [ "$DISPATCH_HTTP_STATUS" != "204" ]; then
            echo "::error::Unexpected recovery dispatch HTTP status: $DISPATCH_HTTP_STATUS."
            if [ -s dispatch-response.txt ]; then cat dispatch-response.txt; fi
            exit 1
          fi
          echo "SELF_HEALING: recovery dispatched successfully."

name: Scheduler Policy Tests

on:
  pull_request:
    paths:
      - ".github/workflows/daily-youtube-research.yml"
      - ".github/workflows/youtube-research-self-healing.yml"
      - ".github/workflows/scheduler-heartbeat.yml"
      - "tests/test_scheduler_policy.py"
      - "tests/test_heartbeat_evidence.py"
      - "tests/test_mcp_sse.py"
      - "scripts/notion_writeback.py"
      - "scripts/recovery_policy.py"
      - "scripts/mcp_sse.py"
      - "scripts/daily_summary.py"
      - "scripts/build_daily_reports.py"
      - "tests/test_daily_summary.py"
      - ".github/workflows/scheduler-policy-tests.yml"
      - ".github/workflows/mcp-handshake-test.yml"
  push:
    branches:
      - "fix/p1-heartbeat-evidence-validation-2026-10-16"
      - "fix/p1-scheduler-heartbeat-guard"

permissions:
  contents: read

jobs:
  scheduler-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic scheduler policy tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

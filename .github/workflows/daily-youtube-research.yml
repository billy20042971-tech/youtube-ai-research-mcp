name: Daily YouTube Research via MCP

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/daily-youtube-research.yml"
  schedule:
    - cron: "55 0 * * *"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runtime smoke test
        run: |
          set -euo pipefail
          echo "GitHub Actions runtime OK"
          python --version
          curl --version | head -n 1

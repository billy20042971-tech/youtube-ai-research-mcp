name: Daily YouTube Research via MCP
# Pipeline v1.5: report generator normalizes enriched MCP comment lists.

on:
  workflow_dispatch:
    inputs:
      recovery_attempt:
        description: "Self-healing recovery dispatch"
        required: false
        default: "false"
        type: string
  push:
    paths:
      - ".github/workflows/daily-youtube-research.yml"
      - "scripts/build_daily_reports.py"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-ai-research-daily
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run verified research pipeline
        shell: bash
        env:
          MCP_URL: https://youtube-ai-research-mcp.onrender.com/mcp
        run: |
          set -u
          mkdir -p data reports

          EXECUTION_ID="gh-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          STATE_FILE="data/execution-state.json"
          RECOVERY_ATTEMPT="false"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RECOVERY_ATTEMPT="$(python - <<'PY'
          import json, os
          try:
              e=json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
              print(str(e.get("inputs", {}).get("recovery_attempt", "false")).lower())
          except Exception:
              print("false")
          PY
          )"
          fi

          write_state() {
            local status="$1"
            local reason="${2:-}"
            local recovery="${3:-}"
            RECOVERY_ATTEMPT="$RECOVERY_ATTEMPT" python - "$EXECUTION_ID" "$STARTED_AT" "$status" "$reason" "$recovery" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$MCP_URL" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          execution_id, started_at, status, reason, recovery, run_id, attempt, event, mcp_url = sys.argv[1:]
          state = {
              "execution_id": execution_id,
              "workflow": "Daily YouTube Research via MCP",
              "status": status,
              "started_at": started_at,
              "completed_at": datetime.now(timezone.utc).isoformat(),
              "github_run_id": run_id,
              "github_run_attempt": attempt,
              "trigger": event,
              "recovery_attempt": os.getenv("RECOVERY_ATTEMPT", "false").lower() == "true",
              "mcp_endpoint": mcp_url,
              "data": "PASS" if status == "SUCCESS" else "UNKNOWN",
              "reports": "PASS" if status == "SUCCESS" else "UNKNOWN",
              "verification": "PASS" if status == "SUCCESS" else "FAIL",
              "failure_reason": reason or None,
              "recovery_action": recovery or None
          }
          latest = Path("data/latest.json")
          if latest.exists():
              try:
                  d=json.loads(latest.read_text(encoding="utf-8"))
                  state["data_generated_at"]=d.get("generated_at")
                  state["data_verification"]=d.get("verification", {})
              except Exception:
                  pass
          Path("data/execution-state.json").write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          }

          finalize() {
            local rc="$?"
            if [ "$rc" -eq 0 ]; then
              write_state "SUCCESS" "" ""
            else
              write_state "FAILED" "${FAILURE_REASON:-Pipeline exited with code $rc}" "${RECOVERY_ACTION:-Inspect execution-state.json and GitHub run logs; retry only after identifying the failed stage.}"
            fi

            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              return "$rc"
            fi

            git config user.name "youtube-research-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ reports/ || true
            git commit -m "chore: record daily YouTube research execution state" || true

            # Another workflow/run may have advanced main while this job was running.
            # Rebase onto the latest remote before publishing the execution state.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                sleep $((attempt * 2))
                continue
              fi
              if git push origin HEAD:main; then
                return "$rc"
              fi
              sleep $((attempt * 2))
            done

            echo "::error::Failed to publish execution state after 3 retries."
            return 1
          }
          trap finalize EXIT

          fail() {
            FAILURE_REASON="$1"
            RECOVERY_ACTION="$2"
            echo "::error::$FAILURE_REASON"
            exit 1
          }

          echo "=== 1. MCP initialize ==="
          curl --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 120 -sS --fail-with-body \
            -D init.headers -o init.body -X POST "$MCP_URL" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"daily-youtube-research","version":"1.3"}}}' \
            || fail "MCP initialize failed" "Check Render MCP health/endpoint and retry."

          SESSION_ID="$(awk 'BEGIN{IGNORECASE=1} /^Mcp-Session-Id:/ {sub(/^[^:]*:[[:space:]]*/, "", $0); gsub(/\r/, "", $0); print $0; exit}' init.headers)"
          [ -n "$SESSION_ID" ] || fail "MCP session ID missing" "Check streamable HTTP session negotiation."

          echo "=== 2. MCP initialized notification ==="
          curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 -sS --fail-with-body \
            -o initialized.body -X POST "$MCP_URL" \
            -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
            -H "Mcp-Session-Id: $SESSION_ID" --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            || fail "MCP initialized notification failed" "Retry MCP session."

          call_tool() {
            local outfile="$1"
            local arguments="$2"
            curl --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 240 -sS --fail-with-body \
              -o "$outfile" -X POST "$MCP_URL" \
              -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
              -H "Mcp-Session-Id: $SESSION_ID" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"youtube_research_sample\",\"arguments\":$arguments}}" 
          }

          echo "=== 3. Fixed sample ==="
          call_tool fixed.body '{"queries":["AI賺錢","AI副業"],"videos_per_query":20,"comments_per_video":20}' \
            || fail "MCP fixed sample failed" "Retry the MCP tool call after checking the Render service."

          echo "=== 4. Dynamic 72h sample ==="
          PUBLISHED_AFTER="$(python - <<'PY'
          from datetime import datetime, timezone, timedelta
          print((datetime.now(timezone.utc) - timedelta(hours=72)).strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          )"
          echo "Using dynamic 72h cutoff: $PUBLISHED_AFTER"
          call_tool recent.body "{\"queries\":[\"AI賺錢\",\"AI副業\"],\"videos_per_query\":20,\"comments_per_video\":20,\"published_after\":\"$PUBLISHED_AFTER\"}" \
            || fail "MCP dynamic 72h sample failed" "Retry the MCP tool call; do not publish stale data."

          echo "=== 5. Parse and verify ==="
          python - <<'PY' || exit 1
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          def parse_sse(path):
              text=Path(path).read_text(encoding="utf-8-sig")
              payloads=[line[6:].strip() for line in text.splitlines() if line.startswith("data: ")]
              if not payloads: raise RuntimeError(f"No SSE data found in {path}")
              outer=json.loads(payloads[-1])
              if "error" in outer: raise RuntimeError(json.dumps(outer["error"], ensure_ascii=False))
              result=outer.get("result", {})
              structured=result.get("structuredContent")
              if structured is not None: return structured
              for item in result.get("content", []):
                  if item.get("type")=="text": return json.loads(item["text"])
              raise RuntimeError(f"No structured result in {path}")

          now=datetime.now(timezone.utc)
          cutoff=now-timedelta(hours=72)
          fixed=parse_sse("fixed.body")
          recent=parse_sse("recent.body")
          videos=recent.get("videos", [])
          if not isinstance(videos, list) or not videos:
              raise RuntimeError("72h sample contains no videos")
          fresh=[]; stale=[]
          for v in videos:
              published=v.get("published_at")
              if not published: stale.append(v); continue
              try:
                  dt=datetime.fromisoformat(published.replace("Z","+00:00"))
                  (fresh if dt>=cutoff else stale).append(v)
              except Exception:
                  stale.append(v)
          verified_72h = bool(fresh) and not stale
          if not (
              verified_72h is True
              and len(fresh) > 0
              and len(stale) == 0
          ):
              raise RuntimeError(
                  f"72h verification failed: fresh={len(fresh)}, stale_or_invalid={len(stale)}"
              )
          data={
              "generated_at":now.isoformat(),
              "source":"YouTube Research MCP",
              "mcp_endpoint":"https://youtube-ai-research-mcp.onrender.com/mcp",
              "published_after":cutoff.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "fixed_sample":fixed,
              "recent_72h_sample":recent,
              "verification":{"fresh_videos":len(fresh),"stale_or_invalid_videos":len(stale),"verified_72h":verified_72h}
          }
          out=Path("data"); out.mkdir(exist_ok=True)
          stamp=now.strftime("%Y-%m-%d")
          (out/f"youtube-research-{stamp}.json").write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          (out/"latest.json").write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"Verified 72h data: fresh={len(fresh)}, stale={len(stale)}")
          PY
          if [ "$?" -ne 0 ]; then
            fail "72h data verification failed" "Do not publish today's trend analysis; inspect the raw MCP sample."
          fi

          echo "=== 6. Prepare compact analysis data ==="
          python - <<'PY' || fail "Compact data preparation failed" "Inspect data/latest.json structure."
          import json
          from pathlib import Path
          src=json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          recent=src["recent_72h_sample"]
          enriched={v["video_id"]:v for v in recent.get("videos",[]) if v.get("video_id")}
          out={"generated_at":src["generated_at"],"recent_72h_sample":{}}
          for q,d in recent.get("per_query",{}).items():
              out["recent_72h_sample"][q]=[]
              for v in d.get("videos",[]):
                  e=enriched.get(v.get("video_id"),{})
                  comments=e.get("comments",[])
                  if not isinstance(comments,list): comments=[]
                  out["recent_72h_sample"][q].append({
                      "video_id":v.get("video_id"),"title":v.get("title"),"channel_title":v.get("channel_title"),
                      "published_at":v.get("published_at"),"views":v.get("views"),"likes":v.get("likes"),
                      "comments_count":v.get("comments"),"url":v.get("url"),"query_rank":v.get("query_rank"),
                      "comments_obtained_count":e.get("comments_obtained_count",0),
                      "comments":[{"text":x.get("text"),"likes":x.get("likes"),"reply_count":x.get("reply_count")} for x in comments]
                  })
          Path("data/recent-summary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

          echo "=== 7. Build and verify Word/PPTX ==="
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk             || fail "CJK font installation failed" "Retry runner package installation; do not publish unreadable charts."
          python -m pip install --disable-pip-version-check --quiet python-docx python-pptx matplotlib pillow             || fail "Report dependencies failed to install" "Retry GitHub runner dependency installation."
          python scripts/build_daily_reports.py \
            || fail "Report generation failed" "Inspect scripts/build_daily_reports.py and runner logs."
          python - <<'PY' || fail "Report verification failed" "Inspect reports/latest-manifest.json and generated files."
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          m=json.loads(Path("reports/latest-manifest.json").read_text(encoding="utf-8"))
          for key in ("word","pptx","chart"):
              p=Path(m[key])
              if not p.is_file() or p.stat().st_size==0:
                  raise RuntimeError(f"Missing or empty report: {p}")
          generated_at=m.get("generated_at")
          if not generated_at:
              raise RuntimeError("Report manifest generated_at is missing")
          dt=datetime.fromisoformat(generated_at.replace("Z","+00:00"))
          if dt < datetime.now(timezone.utc) - timedelta(minutes=15):
              raise RuntimeError(f"Report manifest is stale: {generated_at}")
          print("Word/PPTX/PNG manifest verified and fresh.")
          PY

          echo "=== 8. Pipeline complete ==="

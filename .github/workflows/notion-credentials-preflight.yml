name: Notion Credentials Preflight (No YouTube API)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-credentials-preflight
  cancel-in-progress: false

jobs:
  validate-notion:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate required GitHub Secrets are present
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NOTION_API_KEY" ]; then
            echo "::error::NOTION_API_KEY secret is missing or empty."
            exit 1
          fi
          if [ -z "$NOTION_PAGE_ID" ]; then
            echo "::error::NOTION_PAGE_ID secret is missing or empty."
            exit 1
          fi
          echo "Both required secrets are present (values are not displayed)."

      - name: Write a uniquely identified preflight comment and verify readback
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone

          token = os.environ["NOTION_API_KEY"].strip()
          page_id = os.environ["NOTION_PAGE_ID"].strip()
          execution_id = f"notion-preflight-gh-{os.environ['GH_RUN_ID']}-attempt-{os.environ['GH_RUN_ATTEMPT']}"
          marker = (
              "GitHub Actions Notion credentials preflight (no YouTube research run).\n"
              f"execution_id: {execution_id}\n"
              f"checked_at_utc: {datetime.now(timezone.utc).isoformat()}\n"
              "purpose: verify GitHub Actions secrets, Notion page access, comment write, and API readback."
          )

          def request(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.notion.com/v1" + path,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Notion-Version": "2022-06-28",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  # Never print response bodies or credentials.
                  print(f"::error::Notion API request failed with HTTP {exc.code}; verify page sharing and integration permissions.")
                  raise SystemExit(1)

          created = request("POST", "/comments", {
              "parent": {"page_id": page_id},
              "rich_text": [{"type": "text", "text": {"content": marker[:1900]}}],
          })
          comment_id = created.get("id")
          if not comment_id:
              print("::error::Notion API did not return a comment ID.")
              raise SystemExit(1)

          query = urllib.parse.urlencode({"block_id": page_id, "page_size": "100"})
          listing = request("GET", f"/comments?{query}")
          def text_of(comment):
              return "".join(
                  item.get("plain_text", item.get("text", {}).get("content", ""))
                  for item in comment.get("rich_text", [])
              )
          found = next(
              (item for item in listing.get("results", [])
               if item.get("id") == comment_id and execution_id in text_of(item)),
              None,
          )
          if found is None:
              listing = request("GET", f"/comments?{query}")
              found = next(
                  (item for item in listing.get("results", [])
                   if item.get("id") == comment_id and execution_id in text_of(item)),
                  None,
              )
          if found is None:
              print("::error::Comment write returned but the same comment could not be read back.")
              raise SystemExit(1)
          print(json.dumps({
              "status": "PASS",
              "execution_id": execution_id,
              "comment_id": comment_id,
              "secrets_present": True,
              "notion_write_verified": True,
              "notion_readback_verified": True,
          }))
          PY

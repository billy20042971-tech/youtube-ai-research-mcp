name: Notion Database Credentials Preflight (No YouTube API)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-credentials-preflight
  cancel-in-progress: false

jobs:
  validate-notion:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate required GitHub Secrets are present
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NOTION_API_KEY" ]; then
            echo "::error::NOTION_API_KEY secret is missing or empty."
            exit 1
          fi
          if [ -z "$NOTION_DATABASE_ID" ]; then
            echo "::error::NOTION_DATABASE_ID secret is missing or empty."
            exit 1
          fi
          echo "Required database credentials are present (values are not displayed)."

      - name: Create isolated database test row, verify write/readback, and archive it
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/notion_credentials_preflight.py
